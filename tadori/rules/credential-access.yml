# Credential and one-time-code theft.
---
rule:
  meta:
    id: TAD-CRED-0001
    name: read notifications, including one-time codes
    scope: method
    severity: high
    attack: [T1517]
    description: >
      Implements a notification listener and pulls the text out of posted
      notifications. This is the modern OTP-theft path: no SMS permission is
      needed if the code arrives as a notification.
    references:
      - https://attack.mitre.org/techniques/T1517/
  features:
    - or:
        - method: "/->onNotificationPosted\\(/"
        - api: "Landroid/service/notification/StatusBarNotification;->getNotification"
        - api: "Landroid/service/notification/NotificationListenerService;->getActiveNotifications"
    - or:
        - permission: android.permission.BIND_NOTIFICATION_LISTENER_SERVICE
        - component: "service:notification_listener"
  reachable_from:
    entrypoint: [notification_listener, callback, service]
    max_hops: 6
---
rule:
  meta:
    id: TAD-CRED-0002
    name: intercept incoming SMS messages
    scope: method
    severity: high
    attack: [T1636.004, T1582]
    description: >
      Parses the body of an incoming SMS. Used to lift 2FA codes, and often
      paired with aborting the broadcast so the user never sees the message.
    references:
      - https://attack.mitre.org/techniques/T1636/004/
  features:
    - or:
        - api: "Landroid/telephony/SmsMessage;->getMessageBody"
        - api: "Landroid/telephony/SmsMessage;->getDisplayMessageBody"
        - api: "Landroid/telephony/SmsMessage;->createFromPdu"
        - string: "content://sms"
    - or:
        - permission: android.permission.RECEIVE_SMS
        - permission: android.permission.READ_SMS
        - intent_action: android.provider.Telephony.SMS_RECEIVED
  reachable_from:
    entrypoint: [exported_receiver, receiver, callback, service]
    max_hops: 6
---
rule:
  meta:
    id: TAD-CRED-0003
    name: suppress an incoming SMS from the user
    scope: method
    severity: high
    attack: [T1628.002, T1582]
    description: >
      Aborts the SMS broadcast so the default messaging app never shows it,
      hiding bank alerts or stolen 2FA codes from the victim.
    references:
      - https://attack.mitre.org/techniques/T1628/002/
  features:
    - api: "Landroid/content/BroadcastReceiver;->abortBroadcast"
    - or:
        - permission: android.permission.RECEIVE_SMS
        - intent_action: android.provider.Telephony.SMS_RECEIVED
---
rule:
  meta:
    id: TAD-CRED-0004
    name: send SMS without user interaction
    scope: method
    severity: medium
    attack: [T1582]
    description: >
      Sends SMS from code. Used for premium-rate fraud, for spreading via the
      victim's contact list, and as an out-of-band C2 channel.
    references:
      - https://attack.mitre.org/techniques/T1582/
  features:
    - or:
        - api: "Landroid/telephony/SmsManager;->sendTextMessage"
        - api: "Landroid/telephony/SmsManager;->sendMultipartTextMessage"
        - api: "Landroid/telephony/SmsManager;->sendDataMessage"
    - permission: android.permission.SEND_SMS
---
rule:
  meta:
    id: TAD-CRED-0005
    name: read the clipboard
    scope: method
    severity: medium
    attack: [T1414]
    description: >
      Reads clipboard contents, where password managers, seed phrases and
      copied one-time codes land.
    references:
      - https://attack.mitre.org/techniques/T1414/
  features:
    - or:
        - api: "Landroid/content/ClipboardManager;->getPrimaryClip"
        - api: "Landroid/text/ClipboardManager;->getText"
        - api: "Landroid/content/ClipboardManager;->addPrimaryClipChangedListener"
