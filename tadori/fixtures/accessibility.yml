  app:
    permissions: [android.permission.SYSTEM_ALERT_WINDOW]
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->show()V"
        api:
          - "Landroid/view/WindowManager;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V"
        string: []
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        calls: ["Lcom/x/Main;->show()V"]
