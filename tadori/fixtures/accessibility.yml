# Fixtures for tadori/rules/accessibility.yml and overlay.yml.
---
fixture:
  name: accessibility service performs a global action
  rule: TAD-ACCS-0001
  expect: match
  entry_kind: accessibility_service
  hops: 0
  app:
    components:
      - type: service
        name: com.x.Svc
        permission: android.permission.BIND_ACCESSIBILITY_SERVICE
    methods:
      - ref: "Lcom/x/Svc;->onAccessibilityEvent(Landroid/view/accessibility/AccessibilityEvent;)V"
        api:
          - "Landroid/accessibilityservice/AccessibilityService;->performGlobalAction(I)Z"
---
fixture:
  name: gesture dispatch two hops below the accessibility callback
  rule: TAD-ACCS-0001
  expect: match
  entry_kind: accessibility_service
  hops: 2
  app:
    components:
      - type: service
        name: com.x.Svc
        permission: android.permission.BIND_ACCESSIBILITY_SERVICE
    methods:
      - ref: "Lcom/x/Svc;->onAccessibilityEvent(Landroid/view/accessibility/AccessibilityEvent;)V"
        calls: ["Lcom/x/Ats;->run()V"]
      - ref: "Lcom/x/Ats;->run()V"
        calls: ["Lcom/x/Ats;->tap()V"]
      - ref: "Lcom/x/Ats;->tap()V"
        api:
          - "Landroid/accessibilityservice/AccessibilityService;->dispatchGesture(Landroid/accessibayservice/GestureDescription;)Z"
---
fixture:
  name: node action without any accessibility service is not this capability
  rule: TAD-ACCS-0001
  expect: no-match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        api: ["Landroid/view/accessibility/AccessibilityNodeInfo;->performAction(I)Z"]
---
