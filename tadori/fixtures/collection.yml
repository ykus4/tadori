  rule: TAD-COLL-0001
  expect: match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        api:
          - "Landroid/media/projection/MediaProjectionManager;->createScreenCaptureIntent()Landroid/content/Intent;"
