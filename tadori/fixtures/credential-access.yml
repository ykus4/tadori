    components:
      - type: receiver
        name: com.x.SmsRcv
        actions: [android.provider.Telephony.SMS_RECEIVED]
    methods:
      - ref: "Lcom/x/SmsRcv;->onReceive(Landroid/content/Context;Landroid/content/Intent;)V"
        api:
          - "Landroid/telephony/SmsMessage;->getMessageBody()Ljava/lang/String;"
---
fixture:
  name: SMS parsing only reachable from application startup, not from a receiver
