# Fixtures for tadori/rules/credential-access.yml.
---
fixture:
  name: notification listener reads a posted notification
  rule: TAD-CRED-0001
  expect: match
  entry_kind: notification_listener
  hops: 0
  app:
    components:
      - type: service
        name: com.x.NotifSvc
        permission: android.permission.BIND_NOTIFICATION_LISTENER_SERVICE
    methods:
      - ref: "Lcom/x/NotifSvc;->onNotificationPosted(Landroid/service/notification/StatusBarNotification;)V"
        api:
          - "Landroid/service/notification/StatusBarNotification;->getNotification()Landroid/app/Notification;"
---
fixture:
  name: notification APIs without a listener service
  rule: TAD-CRED-0001
  expect: no-match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        api:
          - "Landroid/service/notification/NotificationListenerService;->getActiveNotifications()V"
