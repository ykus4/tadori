# Fixtures for tadori/rules/dropper.yml and c2.yml.
---
fixture:
  name: an install session is created
  rule: TAD-DROP-0001
  expect: match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        api:
          - "Landroid/content/pm/PackageInstaller;->createSession(Landroid/content/pm/PackageInstaller$SessionParams;)I"
---
fixture:
  name: sharing an APK file without the install permission
  rule: TAD-DROP-0001
  expect: no-match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        string: ["application/vnd.android.package-archive"]
---
fixture:
  name: code is loaded from a file at runtime
  rule: TAD-DROP-0002
  expect: match
  app:
    components:
      - {type: activity, name: com.x.Main, actions: [android.intent.action.MAIN]}
    methods:
      - ref: "Lcom/x/Main;->onCreate(Landroid/os/Bundle;)V"
        api:
          - "Ldalvik/system/DexClassLoader;-><init>(Ljava/lang/String;Ljava/lang/String;)V"
---
fixture:
  name: a class decrypts an asset and hands it to a class loader
  rule: TAD-DROP-0003
  expect: match
  app:
    methods:
      - ref: "Lcom/x/Loader;->decrypt()[B"
        api: ["Ljavax/crypto/Cipher;->doFinal([B)[B"]
      - ref: "Lcom/x/Loader;->stage()V"
        api:
          - "Landroid/content/res/AssetManager;->open(Ljava/lang/String;)Ljava/io/InputStream;"
      - ref: "Lcom/x/Loader;->load()V"
        api:
          - "Ldalvik/system/InMemoryDexClassLoader;-><init>([B)V"
---
fixture:
  name: decrypting an asset without loading code from it
  rule: TAD-DROP-0003
  expect: no-match
  app:
    methods:
      - ref: "Lcom/x/Loader;->decrypt()[B"
        api:
          - "Ljavax/crypto/Cipher;->doFinal([B)[B"
          - "Landroid/content/res/AssetManager;->open(Ljava/lang/String;)Ljava/io/InputStream;"
