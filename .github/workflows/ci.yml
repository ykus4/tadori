name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Validate the bundled rule pack
        run: |
          uv run tadori rules lint
          uv run tadori rules test --require-coverage

      - name: CLI smoke test
        run: |
          uv run tadori --version
          uv run tadori rules list
          uv run tadori rules show TAD-ACCS-0001

      - name: Docs build and generated pages are current
        run: |
          uv sync --group docs
          uv run python scripts/gen_rule_docs.py --out docs/rule-pack.md
          git diff --exit-code docs/rule-pack.md
          uv run mkdocs build --strict
