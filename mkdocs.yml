site_name: tadori
site_description: Entry-point-aware capability detection for Android APKs
site_url: https://ykus4.github.io/tadori
repo_url: https://github.com/ykus4/tadori
repo_name: ykus4/tadori
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Rule pack: rule-pack.md
  - Writing rules: rules.md
  - Design notes: design.md
  - Roadmap: ROADMAP.md
